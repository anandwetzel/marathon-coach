[project]
name = "marathon-coach"
version = "0.1.0"
description = "Adaptive marathon training planner for PEAK Lake Garda 42 2027"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pandas>=2.0",
    "pyyaml>=6.0",
    "streamlit>=1.28",
    "streamlit-calendar>=1.2",
    "altair>=5.0",
]

[project.scripts]
marathon-coach = "src.cli:main"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.setuptools.package-dir]
"" = "."
